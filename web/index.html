<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:8787 http://127.0.0.1:8787 https://*.maptiler.com https://unpkg.com https://fonts.gstatic.com https://fonts.googleapis.com https://www.gstatic.com data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:8787 http://127.0.0.1:8787 https://unpkg.com https://www.gstatic.com blob:; style-src 'self' 'unsafe-inline' http://localhost:8787 http://127.0.0.1:8787 https://unpkg.com https://fonts.googleapis.com; worker-src 'self' http://localhost:8787 http://127.0.0.1:8787 https://unpkg.com blob:; child-src 'self' blob:; img-src 'self' data: blob: http://localhost:8787 http://127.0.0.1:8787 https://*.maptiler.com https://*.openstreetmap.org; connect-src 'self' http://localhost:8787 ws://localhost:8787 http://127.0.0.1:8787 ws://127.0.0.1:8787 ws://localhost:* http://localhost:* https://*.maptiler.com https://unpkg.com https://fonts.gstatic.com https://www.gstatic.com; object-src 'none'; base-uri 'self';">
  <meta name="description" content="TKA - Tiket Kereta Api Indonesia">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="appstka">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>appstka</title>
  <link rel="manifest" href="manifest.json">
  <!-- Preconnect, Modulepreload & Stylesheet MapLibre GL JS self-hosted dari Gateway agar buka peta < 1 detik tanpa warning preload -->
  <link rel="dns-prefetch" href="https://api.maptiler.com">
  <link rel="preconnect" href="https://api.maptiler.com" crossorigin>
  <link rel="preconnect" href="http://localhost:8787" crossorigin>
  <link rel="modulepreload" href="http://localhost:8787/api/map/lib/maplibre-gl.mjs" crossorigin>
  <link rel="modulepreload" href="http://localhost:8787/api/map/lib/maplibre-gl-shared.mjs" crossorigin>
  <link rel="stylesheet" href="http://localhost:8787/api/map/lib/maplibre-gl.css">

  <style>
    /* Mencegah layar ter-highlight biru (text selection) saat klik atau drag mouse di browser */
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    input, textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
